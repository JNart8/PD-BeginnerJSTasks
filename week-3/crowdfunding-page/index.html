<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Crowdfunding Product</title>
		<link rel="stylesheet" href="styles/styles.css" />
	</head>
	<body>
		<main class="product-page">
			<section class="product-info">
				<img
					src="https://via.placeholder.com/300x200"
					alt="Product Image"
					class="product-image" />
				<div class="details">
					<h1>Wireless Bluetooth Headphones</h1>
					<p>High-fidelity sound with noise cancellation. Goal: $10,000</p>
					<div class="progress-section">
						<div class="progress-bar">
							<div id="progressFill" class="progress-fill"></div>
						</div>
						<div class="stats">
							<div><strong id="backed">$5,250</strong> backed</div>
							<div><span id="backers">100</span> of 1,000 backers</div>
						</div>
					</div>
					<div class="pledge-options">
						<button class="pledge-btn" data-amount="25">$25 - Basic</button>
						<button class="pledge-btn" data-amount="75">$75 - Premium</button>
						<button class="pledge-btn" data-amount="150">$150 - Deluxe</button>
					</div>
				</div>
			</section>
		</main>

		<!-- Modal -->
		<div id="pledgeModal" class="modal" style="display: none">
			<div class="modal-content">
				<h2>Back this Project</h2>
				<input
					type="number"
					id="customAmount"
					placeholder="Enter custom amount ($)"
					min="5" />
				<div class="modal-buttons">
					<button id="confirmPledge">Pledge</button>
					<button id="cancelPledge">Cancel</button>
				</div>
			</div>
		</div>

		<script src="scripts/script.js"></script>
	</body>
</html>
