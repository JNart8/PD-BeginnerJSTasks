<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>IP Address Tracker</title>
		<link
			rel="stylesheet"
			href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
		<link rel="stylesheet" href="styles/styles.css" />
	</head>
	<body>
		<header>
			<h1>IP Address Tracker</h1>
			<form id="ipForm">
				<input
					type="text"
					id="ipInput"
					placeholder="Enter an IP address (or leave blank for current)" />
				<button type="submit">Track</button>
			</form>
		</header>

		<main>
			<div id="infoCard" class="info-card" style="display: none">
				<h2 id="ipDisplay"></h2>
				<div class="info-grid">
					<div><strong>City:</strong> <span id="city"></span></div>
					<div><strong>Region:</strong> <span id="region"></span></div>
					<div><strong>Country:</strong> <span id="country"></span></div>
					<div><strong>Lat/Lng:</strong> <span id="latLng"></span></div>
					<div><strong>Timezone:</strong> <span id="timezone"></span></div>
				</div>
			</div>
			<div id="map"></div>
		</main>

		<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
		<script src="scripts/script.js"></script>
	</body>
</html>
